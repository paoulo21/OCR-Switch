name: Build Switch OCR Overlay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile switch-ocr.ovl
        run: |
          cd switch-overlay
          make -j$(nproc)
          echo "=== Fichiers .ovl générés ==="
          find . -name "*.ovl"
          find . -name "*.ovl" -exec cp -v {} ../ \;
          cd ..
          chmod -R 777 .
          ls -lh *.ovl

      - name: Upload switch-ocr.ovl artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-ocr.ovl
          path: "*.ovl"
          if-no-files-found: warn
