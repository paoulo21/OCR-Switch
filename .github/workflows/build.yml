name: Build Switch OCR Overlay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile switch-ocr.ovl
        run: |
          cd switch-overlay
          make -j$(nproc) 2>&1 | tee /tmp/build.log || {
            echo "## ❌ Erreur de compilation" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload switch-ocr.ovl artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-ocr.ovl
          path: switch-overlay/switch-ocr.ovl
          if-no-files-found: error
