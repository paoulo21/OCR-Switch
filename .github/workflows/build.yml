name: Build Switch OCR Overlay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile switch-ocr.ovl
        run: |
          cd switch-overlay
          make clean
          make -j$(nproc)
          ls -la switch-ocr.ovl
          cp -v switch-ocr.ovl ../
          cd ..
          chmod 777 switch-ocr.ovl

      - name: Upload switch-ocr.ovl artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-ocr.ovl
          path: switch-ocr.ovl
          if-no-files-found: error
