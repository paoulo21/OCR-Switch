name: Build Switch OCR Overlay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile switch-ocr.ovl
        run: |
          cd switch-overlay
          make clean || true
          make -j$(nproc) 2>&1 | tee build.log
          echo "=== Fichiers après compilation ==="
          ls -la
          find . -name "*.ovl" -exec cp -v {} .. \; || true
          cd ..
          ls -la *.ovl

      - name: Upload switch-ocr.ovl artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-ocr.ovl
          path: switch-ocr.ovl
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: switch-overlay/build.log
          if-no-files-found: ignore
