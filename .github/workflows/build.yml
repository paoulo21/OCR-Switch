name: Build Switch OCR Overlay

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and libtesla
        run: |
          apt-get update && apt-get install -y git make
          git clone https://github.com/WerWolv/libtesla.git
          cd libtesla
          make install -j$(nproc)
          cd ..

      - name: Compile switch-ocr.ovl
        run: |
          cd switch-overlay
          make -j$(nproc)

      - name: Upload switch-ocr.ovl artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-ocr.ovl
          path: switch-overlay/switch-ocr.ovl
          if-no-files-found: error
